version: "3"

vars:
  GOOSE_VERSION: "v3.27.0"
  BIN_DIR: "{{.ROOT_DIR}}/bin"
  GOOSE: "{{.BIN_DIR}}/goose"

tasks:
  compose:up:
    desc: "Поднимает PostgreSQL для урока"
    cmds:
      - docker compose up -d

  compose:down:
    desc: "Останавливает PostgreSQL и удаляет volume"
    cmds:
      - docker compose down -v

  goose:install:
    desc: "Устанавливает goose"
    cmds:
      - GOBIN={{.BIN_DIR}} go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}
    status:
      - test -x {{.GOOSE}}

  migrate:up:
    desc: "Применяет все миграции"
    deps: [goose:install]
    dotenv: [".env"]
    cmds:
      - '{{.GOOSE}} -dir migrations postgres "$PG_DSN" up'

  migrate:down:
    desc: "Откатывает последнюю миграцию"
    deps: [goose:install]
    dotenv: [".env"]
    cmds:
      - '{{.GOOSE}} -dir migrations postgres "$PG_DSN" down'

  migrate:status:
    desc: "Показывает статус миграций"
    deps: [goose:install]
    dotenv: [".env"]
    cmds:
      - '{{.GOOSE}} -dir migrations postgres "$PG_DSN" status'

  migrate:create:
    desc: "Создаёт новую SQL-миграцию"
    deps: [goose:install]
    cmds:
      - mkdir -p migrations
      - '{{.GOOSE}} -dir migrations create {{.CLI_ARGS}} sql'

  run:
    desc: "Запускает HTTP сервис урока"
    dotenv: [".env"]
    cmds:
      - go run ./cmd/inventory
